name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      version_code:
        description: "Android versionCode (integer)"
        required: true
        default: "1"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="${TAG#v}"
            # versionCode from semver: major*1e6 + minor*1e3 + patch
            IFS='.' read -r MAJOR MINOR PATCH <<< "${NAME}"
            CODE=$(( ${MAJOR:-0} * 1000000 + ${MINOR:-0} * 1000 + ${PATCH:-0} ))
          else
            TAG="v${{ inputs.version_name }}"
            NAME="${{ inputs.version_name }}"
            CODE="${{ inputs.version_code }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }}

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VoidLauncher.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Void ${{ steps.ver.outputs.name }}
          body: |
            ## Void Launcher ${{ steps.ver.outputs.name }}

            versionCode: ${{ steps.ver.outputs.code }}

            Install **VoidLauncher.apk**, or use **Settings → Updates** in the app.
          files: dist/VoidLauncher.apk
          generate_release_notes: true
