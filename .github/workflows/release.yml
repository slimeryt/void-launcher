name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 0.2.41, 0.2.41-beta.1, 0.2.41-dev.1)"
        required: true
        default: "0.1.0"
      version_code:
        description: "Android versionCode (integer)"
        required: true
        default: "1"
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - developer

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="${TAG#v}"
          else
            TAG="v${{ inputs.version_name }}"
            NAME="${{ inputs.version_name }}"
          fi

          # Semver core without -beta / -dev suffix for versionCode encoding
          CORE="${NAME%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CORE}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # 0.2.46 → base 2_046_000 so patch lines stay monotonic:
            #   -dev.N  → base + N
            #   -beta.N → base + 500 + N
            #   stable  → base + 900
            # 0.2.47 stable → 2_047_900 > any 0.2.46 build
            BASE=$(( ${MAJOR:-0} * 1000000 + ${MINOR:-0} * 1000 + ${PATCH:-0} ))
            CODE_BASE=$(( BASE * 1000 ))
            if [[ "$NAME" =~ -dev\.([0-9]+)$ ]]; then
              CODE=$(( CODE_BASE + ${BASH_REMATCH[1]} ))
            elif [[ "$NAME" =~ -beta\.([0-9]+)$ ]] || [[ "$NAME" =~ -rc\.([0-9]+)$ ]]; then
              CODE=$(( CODE_BASE + 500 + ${BASH_REMATCH[1]} ))
            else
              CODE=$(( CODE_BASE + 900 ))
            fi
          else
            CODE="${{ inputs.version_code }}"
          fi

          # Channel from tag suffix or workflow input
          LOWER="$(echo "$NAME" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "$LOWER" == *"-dev"* || "$LOWER" == *"-alpha"* ]]; then
              CHANNEL="developer"
            elif [[ "$LOWER" == *"-beta"* || "$LOWER" == *"-rc"* ]]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          else
            CHANNEL="${{ inputs.channel }}"
          fi

          PRERELEASE=false
          if [[ "$CHANNEL" == "beta" || "$CHANNEL" == "developer" ]]; then
            PRERELEASE=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      # Local `gh release create` ships often push the same tag; don't overwrite those APKs
      # with a CI build that used a different versionCode encoding.
      - name: Skip if release already has APK
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            if gh release view "${{ steps.ver.outputs.tag }}" --json assets \
              --jq '.assets[].name' | grep -qx 'Polar.apk'; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "Release ${{ steps.ver.outputs.tag }} already has Polar.apk — skipping CI rebuild."
              exit 0
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        if: steps.skip.outputs.exists != 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -PversionName=${{ steps.ver.outputs.name }} \
            -PversionCode=${{ steps.ver.outputs.code }}

      - name: Stage APK
        if: steps.skip.outputs.exists != 'true'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Polar.apk
          cp dist/Polar.apk dist/VoidLauncher.apk
          sha256sum dist/Polar.apk | tee dist/Polar.apk.sha256
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "Using build-tools: $BT"
          "$BT/apksigner" verify --verbose dist/Polar.apk
          "$BT/zipalign" -c -v 4 dist/Polar.apk

      - name: Create GitHub Release
        if: steps.skip.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Polar ${{ steps.ver.outputs.name }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          body: |
            ## Polar ${{ steps.ver.outputs.name }}

            versionCode: ${{ steps.ver.outputs.code }}
            channel: ${{ steps.ver.outputs.channel }}

            Install **Polar.apk**, or use **Settings → Updates** in the app.

            | Channel | Who gets this |
            |---|---|
            | stable | Everyone (Beta Updates = Off) |
            | beta | Public Beta + Developer |
            | developer | Developer only |

            SHA-256 of Polar.apk is attached as `Polar.apk.sha256`.

            If Android says the package conflicts with an existing app, uninstall the old Polar/Void once (same package id: `com.voidlauncher.app`), then install this APK.
          files: |
            dist/Polar.apk
            dist/VoidLauncher.apk
            dist/Polar.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
